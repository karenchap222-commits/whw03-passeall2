steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt update
      sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zstd file wget

  - name: Clone OpenWrt
    run: |
      git clone --depth=1 --branch openwrt-25.12 https://github.com/openwrt/openwrt.git

  - name: Prepare feeds
    run: |
      cd openwrt
      ./scripts/feeds update -a
      ./scripts/feeds install -a

  - name: Add Passwall feed
    run: |
      cd openwrt
      echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git" >> feeds.conf.default
      echo "src-git passwall_luci https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default
      ./scripts/feeds update passwall_packages
      ./scripts/feeds update passwall_luci
      ./scripts/feeds install -a

  - name: Configure
    run: |
      cd openwrt
      echo "CONFIG_TARGET_ipq40xx=y" > .config
      echo "CONFIG_TARGET_ipq40xx_generic=y" >> .config
      echo "CONFIG_PACKAGE_luci-app-passwall2=y" >> .config
      echo "CONFIG_PACKAGE_xray-core=y" >> .config
      make defconfig

  - name: Build
    run: |
      cd openwrt
      make -j$(nproc)

  - name: Upload firmware
    uses: actions/upload-artifact@v4
    with:
      name: WHW03-v2-passwall2-xray
      path: openwrt/bin/targets/ipq40xx/generic/*
