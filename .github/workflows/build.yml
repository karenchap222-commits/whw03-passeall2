name: Build OpenWrt Passwall2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip wget

      - name: Download OpenWrt
        run: |
          git clone --depth=1 --branch openwrt-25.12 https://github.com/openwrt/openwrt.git

      - name: Add feeds
        run: |
          cd openwrt
          echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git" >> feeds.conf.default
          echo "src-git passwall_luci https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
    run: |
      cd openwrt
      echo "CONFIG_TARGET_ipq40xx=y" > .config
      echo "CONFIG_TARGET_ipq40xx_generic=y" >> .config
      echo "CONFIG_PACKAGE_luci-app-passwall2=y" >> .config
      echo "CONFIG_PACKAGE_xray-core=y" >> .config
      echo "CONFIG_PACKAGE_luci=y" >> .config
      make defconfig


      - name: Build
        run: |
          cd openwrt
          make download -j4
          make -j$(nproc) V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-passwall2
          path: openwrt/bin/
